name: Verify published macOS DMG
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release commit and version
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          git merge-base --is-ancestor HEAD refs/remotes/origin/release
          grep -Fxq "## $version" CHANGELOG.md
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test
        run: bash scripts/test-custom.sh
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          name="MacTV-Custom-${GITHUB_REF_NAME#v}.dmg"
          cd "$RUNNER_TEMP"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "$name" --pattern "$name.sha256"
          shasum -a 256 -c "$name.sha256"
          hdiutil verify "$name"
