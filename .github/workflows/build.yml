name: Build and test
on:
  push:
    branches: [main, release, 'add-**']
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test
        run: bash scripts/test-custom.sh
      - name: Build universal app
        run: ./build.sh --release
      - name: Check signature and architectures
        run: |
          codesign --verify --deep --strict 'build/MacTV Custom.app'
          lipo 'build/MacTV Custom.app/Contents/MacOS/MacTV' -verify_arch arm64 x86_64
